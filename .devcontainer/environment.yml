name: myenv
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pandas
  - numpy
  - scikit-learn
  - jupyter
  - jupyterlab>=4.0
  - matplotlib
  - seaborn
  - black
  - autopep8
  - pip
  - pip:
    - jupyterlab-lsp
    - python-lsp-server
    - pylint
    - pycodestyle
    # pip package for tokenization by OpenAI
    - tiktoken
    # pip package for OpenAI API
    - openai
    # pip package for Google Generative AI API
    - google-genai

