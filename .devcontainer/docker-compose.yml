version: '3.8'

services:
  # Docker-init service: Fixes Docker socket permissions for DinD
  docker-init:
    image: alpine:3.20
    privileged: true # Required for changing socket permissions
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Mount Docker socket
    command: sh -c "chmod 666 /var/run/docker.sock && sleep 1"
    networks:
      - dev-network

  # Main development container
  datascience:
    build: .
    privileged: true # Required for full Docker functionality
    cap_add:
      - SYS_ADMIN # Additional capabilities for Docker operations
    ports:
      - "8888:8888"
      - "6006:6006"
      - "5000:5000"
      - "8501:8501"
    volumes:
      - ..:/workspaces/gen-ai:cached
      - pip-cache:/home/vscode/.cache/pip # Pip download cache persists across rebuilds
      - python-packages:/home/vscode/venv # Virtual environment persists across rebuilds
      - huggingface-cache:/home/vscode/.cache/huggingface # Model cache persists
      - ~/.ssh:/home/vscode/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock # Docker socket for DinD
    depends_on:
      docker-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
    env_file:
      - .env
    environment:
      - PATH=/home/vscode/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - VIRTUAL_ENV=/home/vscode/venv
    command: sleep infinity
    deploy:
      resources:
        limits:
          cpus: '24' # 24 out of 32 CPUs
          memory: 64G # 64GB out of 94GB RAM
        reservations:
          cpus: '16' # Reserve at least 16 CPUs
          memory: 48G # Reserve at least 48GB
          devices:
            - driver: nvidia
              count: all # Use all available GPUs (gracefully falls back to CPU if unavailable)
              capabilities: [ gpu ]
    networks:
      - dev-network

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434" # API & Web UI port
    environment:
      - OLLAMA_KEEP_MODELS=1 # persist model downloads
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # Use all available GPUs (gracefully falls back to CPU if unavailable)
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD-SHELL", "ollama list | grep -q 'mistral:7b'" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    entrypoint: >
      /bin/bash -c " ollama serve &  sleep 5 && ollama pull mistral:7b && ollama pull bespoke-minicheck:7b-q3_K_M && wait "
    networks:
      - dev-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - dev-network

# Named volumes for persistent data storage
volumes:
  pip-cache: # Caches downloaded pip packages
  python-packages: # Persists installed Python packages in venv
  huggingface-cache: # Caches downloaded Hugging Face models
  ollama_data: # Persists Ollama models
  qdrant_data: # Persists Qdrant vector database data

    # Custom bridge network for inter-container communication
networks:
  dev-network:
    driver: bridge
