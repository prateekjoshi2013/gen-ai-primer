version: '3.8'

services:
  # Docker-init service: Fixes Docker socket permissions for DinD
  docker-init:
    image: alpine:3.20
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: sh -c "chmod 666 /var/run/docker.sock && sleep 1"
    networks:
      - dev-network

  # Main LLM on GPU
  ollama-llm:
    image: ollama/ollama:latest
    container_name: ollama-llm
    ports: ["11434:11434"]
    volumes:
      - ollama_llm:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - dev-network

  # Embeddings on CPU
  ollama-embed:
    image: ollama/ollama:latest
    container_name: ollama-embed
    ports: ["11435:11434"]
    volumes:
      - ollama_embed:/root/.ollama
    environment:
      - OLLAMA_NUM_GPU=0
      - OLLAMA_NUM_THREAD=16
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - dev-network

  # Initialize LLM models
  init-llm:
    image: ollama/ollama:latest
    container_name: init-llm
    depends_on:
      ollama-llm:
        condition: service_healthy  # Wait for ollama-llm to be healthy
    volumes:
      - ollama_llm:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama-llm:11434
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -x
        
        echo "========================================="
        echo "Initializing LLM models..."
        echo "========================================="
        echo "OLLAMA_HOST is: $$OLLAMA_HOST"
        
        # Wait for API to be ready
        echo "Waiting for ollama-llm API..."
        max_retries=30
        retry_count=0
        
        while [ $$retry_count -lt $$max_retries ]; do
          echo "Attempt $$((retry_count + 1))/$$max_retries to connect to ollama API..."
          if ollama list >/dev/null 2>&1; then
            echo "✓ ollama-llm API is ready"
            break
          fi
          retry_count=$$((retry_count + 1))
          echo "Waiting for API... ($$retry_count/$$max_retries)"
          sleep 2
        done
        
        if [ $$retry_count -eq $$max_retries ]; then
          echo "✗ Failed to connect to ollama-llm API after $$max_retries attempts"
          exit 1
        fi
        
        # Check if model exists
        echo ""
        echo "Checking for qwen2.5:14b..."
        
        if ollama list 2>/dev/null | grep -q "qwen2.5:14b"; then
          echo "✓ qwen2.5:14b already exists"
          echo "Skipping download..."
        else
          echo "Downloading qwen2.5:14b..."
          echo "This may take 10-20 minutes..."
          
          if ollama pull qwen2.5:14b; then
            echo "✓ Successfully downloaded qwen2.5:14b"
          else
            echo "✗ Failed to download qwen2.5:14b"
          fi
        fi
        
        # Test model
        echo ""
        echo "Testing model..."
        if echo "test" | ollama run qwen2.5:14b >/dev/null 2>&1; then
          echo "✓ Model test successful"
        else
          echo "⚠ Model loaded but test failed"
        fi
        
        echo ""
        echo "========================================="
        echo "✓ LLM initialization complete!"
        echo "========================================="
        echo ""
        ollama list
        
        # Keep container running for healthcheck verification
        sleep infinity
    healthcheck:
      test: ["CMD", "sh", "-c", "ollama list | grep -q 'qwen2.5:14b' && echo 'Model ready'"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 600s
    restart: unless-stopped
    networks:
      - dev-network

  # Initialize embedding models
  init-embed:
    image: ollama/ollama:latest
    container_name: init-embed
    depends_on:
      ollama-embed:
        condition: service_healthy  # Wait for ollama-embed to be healthy
    volumes:
      - ollama_embed:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama-embed:11434
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -x
        
        echo "========================================="
        echo "Initializing embedding models..."
        echo "========================================="
        echo "OLLAMA_HOST is: $$OLLAMA_HOST"
        
        # Wait for API to be ready
        echo "Waiting for ollama-embed API..."
        max_retries=30
        retry_count=0
        
        while [ $$retry_count -lt $$max_retries ]; do
          echo "Attempt $$((retry_count + 1))/$$max_retries to connect to ollama API..."
          if ollama list >/dev/null 2>&1; then
            echo "✓ ollama-embed API is ready"
            break
          fi
          retry_count=$$((retry_count + 1))
          echo "Waiting for API... ($$retry_count/$$max_retries)"
          sleep 2
        done
        
        if [ $$retry_count -eq $$max_retries ]; then
          echo "✗ Failed to connect to ollama-embed API after $$max_retries attempts"
          exit 1
        fi
        
        # Check if model exists
        echo ""
        echo "Checking for nomic-embed-text..."
        
        if ollama list 2>/dev/null | grep -q "nomic-embed-text"; then
          echo "✓ nomic-embed-text already exists"
          echo "Skipping download..."
        else
          echo "Downloading nomic-embed-text..."
          
          if ollama pull nomic-embed-text; then
            echo "✓ Successfully downloaded nomic-embed-text"
          else
            echo "✗ Failed to download nomic-embed-text"
          fi
        fi
        
        # Test embeddings
        echo ""
        echo "Testing embedding model..."
        if echo "test" | ollama run nomic-embed-text >/dev/null 2>&1; then
          echo "✓ Embedding test successful"
        else
          echo "⚠ Model loaded but test failed"
        fi
        
        echo ""
        echo "========================================="
        echo "✓ Embedding initialization complete!"
        echo "========================================="
        echo ""
        ollama list
        
        # Keep container running for healthcheck verification
        sleep infinity
    healthcheck:
      test: ["CMD", "sh", "-c", "ollama list | grep -q 'nomic-embed-text' && echo 'Model ready'"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 600s
    restart: unless-stopped
    networks:
      - dev-network

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - dev-network

  # MongoDB
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: devdb
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "-u", "admin", "-p", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 5s
      retries: 10
    volumes:
      - mongodb_data:/data/db
    networks:
      - dev-network

  # Valkey in-memory data store
  valkey:
    image: valkey/valkey:alpine3.23
    ports:
      - "6379:6379"
    command: valkey-server --requirepass password
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "password", "ping"]
      interval: 20s
      retries: 10
    networks:
      - dev-network

  # Main development container
  datascience:
    build: .
    container_name: datascience
    privileged: true
    cap_add:
      - SYS_ADMIN
    ports:
      - "8888:8888"
      - "6006:6006"
      - "5000:5000"
      - "8501:8501"
    volumes:
      - ..:/workspaces/gen-ai:cached
      - pip-cache:/home/vscode/.cache/pip
      - python-packages:/home/vscode/venv
      - huggingface-cache:/home/vscode/.cache/huggingface
      - ~/.ssh:/home/vscode/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      docker-init:
        condition: service_completed_successfully
      init-llm:
        condition: service_healthy  # ← CRITICAL: Wait for models to be ready
      init-embed:
        condition: service_healthy  # ← CRITICAL: Wait for models to be ready
      qdrant:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PATH=/home/vscode/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - VIRTUAL_ENV=/home/vscode/venv
      - OLLAMA_LLM_HOST=http://ollama-llm:11434
      - OLLAMA_EMBED_HOST=http://ollama-embed:11434
      - QDRANT_HOST=http://qdrant:6333
    command: sleep infinity
    deploy:
      resources:
        limits:
          cpus: '24'
          memory: 64G
        reservations:
          cpus: '16'
          memory: 48G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - dev-network

# Named volumes
volumes:
  pip-cache:
  python-packages:
  huggingface-cache:
  ollama_llm:
    driver: local
  ollama_embed:
    driver: local
  qdrant_data:
    driver: local
  mongodb_data:

# Network
networks:
  dev-network:
    driver: bridge